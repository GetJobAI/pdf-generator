[package]
name = "pdf-generator"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
  "json",
] }

anyhow = "1"
thiserror = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

typst = "0.14"
typst-as-lib = "0.15"
typst-assets = { version = "0.14", features = ["fonts"] }
typst-pdf = "0.14"

envy = "0.4"
dotenvy = "0.15"
clap = { version = "4", features = ["derive"] }

axum = { version = "0.8", features = ["macros", "http2"] }
utoipa = { version = "5.5", features = ["axum_extras"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }
